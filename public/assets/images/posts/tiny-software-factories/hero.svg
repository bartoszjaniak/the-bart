<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Tiny Software Factories</title><desc id="desc">Mały warsztat AI, który wykonuje zadania według harmonogramu, a człowiek sprawdza wyniki.</desc>
<defs>
